name: Build and publish architecture documentation

on:
  push:
    branches:
      - feat/payment-evidence-investigation-20261112
    paths:
      - 'docs/*.md'
      - 'docs/diagrams/**'
      - 'docs/build_documents.py'
      - '.github/workflows/build-architecture-documents.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document generation dependencies
        run: python -m pip install --disable-pip-version-check "python-docx>=1.1,<2" "python-pptx>=1,<2" "Pillow>=10,<13"
      - name: Generate Word, PowerPoint and diagrams
        run: python docs/build_documents.py
      - name: Publish downloadable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iso20022-architecture-documents
          path: |
            docs/generated/*.docx
            docs/generated/*.pptx
            docs/generated/diagrams/*.png
          if-no-files-found: error
      - name: Commit generated deliverables to branch
        if: github.ref == 'refs/heads/feat/payment-evidence-investigation-20261112'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/
          if git diff --cached --quiet; then
            echo "Generated documentation unchanged."
          else
            git commit -m "docs: publish generated architecture deliverables [skip ci]"
            git push origin HEAD:feat/payment-evidence-investigation-20261112
          fi
