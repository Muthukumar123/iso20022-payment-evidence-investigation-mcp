name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]" pip-audit bandit
      - run: pytest -q
      - run: bandit -q -r src
      # Audit this project's own dependencies, not the runner's preinstalled tooling
      - run: pip-audit .

  glama-container:
    name: Reproducible stdio MCP container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build same container Glama can introspect
        run: docker build --tag iso20022-evidence-mcp:ci .
      - name: Confirm installed server imports without bank credentials
        run: |
          docker run --rm --entrypoint python iso20022-evidence-mcp:ci \
            -c "from iso20022_mcp.server import mcp; print('MCP server import succeeded')"
